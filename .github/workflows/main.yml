name: Checkout Pytest Tests

on:

  push:

    branches:

      - main

  workflow_dispatch:

jobs:

  checkout-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Set Up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install Pytest

        run: python -m pip install pytest

      - name: Run Checkout Tests

        run: python -m pytest -v
